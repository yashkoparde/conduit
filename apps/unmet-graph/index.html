<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Unmet-Economy Graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="../demo-panel.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a0d; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2rem; line-height: 1.5; }
    a { color: #f8fafc; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.4); }
    a:hover { border-bottom-color: #fff; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 1.5rem; align-items: baseline; }
    .title-nav { font-size: 13px; font-weight: 600; color: #94a3b8; }
    .title-nav strong { color: #fff; }
    .canvas-wrap { background: #0c0f16; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; height: 380px; position: relative; margin-bottom: 1.5rem; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media(max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #11141c; border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 4px; }
    .row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 11px; }
    .val { color: #fff; font-weight: 600; }
    .legend { display: flex; gap: 1.5rem; font-size: 11px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    function App() {
      const [g, setG] = React.useState(null);
      const [selectedNode, setSelectedNode] = React.useState(null);
      const canvasRef = React.useRef(null);
      const positionsRef = React.useRef({});

      React.useEffect(() => {
        fetch(`${API}/api/graph`).then(r => r.json()).then(d => {
          setG(d.data);
          if (d.data && d.data.nodes.length > 0) {
            setSelectedNode(d.data.nodes[0]);
          }
        });
      }, []);

      React.useEffect(() => {
        if (!g || !canvasRef.current) return;
        const cv = canvasRef.current;
        const ctx = cv.getContext('2d');
        const w = cv.parentElement.clientWidth;
        const h = cv.parentElement.clientHeight;
        cv.width = w * window.devicePixelRatio;
        cv.height = h * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        const buyers = g.nodes.filter(n => n.type === 'BUYER');
        const msmes = g.nodes.filter(n => n.type === 'MSME');
        const suppliers = g.nodes.filter(n => n.type === 'SUPPLIER');
        const pos = {};

        buyers.forEach((b, i) => pos[b.id] = {x: w * 0.16, y: h * (0.22 + i * 0.3), node: b});
        msmes.forEach((m, i) => pos[m.id] = {x: w * 0.5, y: h * (0.22 + i * 0.3), node: m});
        suppliers.forEach((s, i) => pos[s.id] = {x: w * 0.84, y: h * (0.22 + i * 0.3), node: s});
        positionsRef.current = pos;

        let frame;
        let t = 0;
        function draw() {
          ctx.clearRect(0, 0, w, h);
          t += 0.025;

          // Draw links with moving pulse particles
          g.links.forEach(l => {
            const p1 = pos[l.source];
            const p2 = pos[l.target];
            if (!p1 || !p2) return;

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = l.status === 'VERIFIED' ? 'rgba(56, 189, 248, 0.4)' : 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Particle
            const prog = (t + (l.capital_gap || 0)) % 1;
            const px = p1.x + (p2.x - p1.x) * prog;
            const py = p1.y + (p2.y - p1.y) * prog;
            ctx.beginPath();
            ctx.arc(px, py, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = l.status === 'VERIFIED' ? '#38bdf8' : '#e2e8f0';
            ctx.fill();
          });

          // Draw nodes
          Object.values(pos).forEach(p => {
            const isSel = selectedNode && selectedNode.id === p.node.id;
            ctx.beginPath();
            ctx.arc(p.x, p.y, isSel ? 9 : 6, 0, Math.PI * 2);

            let col = '#e2e8f0';
            if (p.node.type === 'BUYER') col = '#38bdf8';
            if (p.node.type === 'SUPPLIER') col = '#94a3b8';

            ctx.fillStyle = col;
            ctx.fill();
            if (isSel) {
              ctx.strokeStyle = '#fff';
              ctx.lineWidth = 2;
              ctx.stroke();
            }

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '10px JetBrains Mono';
            ctx.fillText(p.node.name, p.x - 30, p.y - 12);
          });

          frame = requestAnimationFrame(draw);
        }

        draw();
        return () => cancelAnimationFrame(frame);
      }, [g, selectedNode]);

      const handleCanvasClick = (e) => {
        const cv = canvasRef.current;
        if (!cv) return;
        const rect = cv.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        for (const p of Object.values(positionsRef.current)) {
          const dx = clickX - p.x;
          const dy = clickY - p.y;
          if (Math.sqrt(dx * dx + dy * dy) < 20) {
            setSelectedNode(p.node);
            break;
          }
        }
      };

      if (!g) return <div style={{padding: '2rem'}}>Loading Topology Graph...</div>;

      return (
        <div>
          <div className="top">
            <div className="title-nav">
              <a href="../../index.html">&larr; Root</a> &nbsp;&bull;&nbsp; <strong>Unmet-Economy Graph</strong>
            </div>
            <div className="legend">
              <div><span className="dot" style={{background: '#38bdf8'}}></span>Buyers</div>
              <div><span className="dot" style={{background: '#e2e8f0'}}></span>MSME Producers</div>
              <div><span className="dot" style={{background: '#94a3b8'}}></span>Suppliers</div>
            </div>
          </div>

          <div className="canvas-wrap">
            <canvas ref={canvasRef} onClick={handleCanvasClick} title="Click any node to inspect parameters"></canvas>
          </div>

          <div className="grid">
            {/* Left: Selected Node Inspector */}
            <div className="card">
              <div style={{fontSize: '11px', color: '#94a3b8', fontWeight: 600}}>Topology Node Inspector</div>
              {selectedNode ? (
                <div style={{marginTop: '0.6rem'}}>
                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline'}}>
                    <span style={{fontSize: '16px', fontWeight: 700, color: '#fff'}}>{selectedNode.name}</span>
                    <span style={{color: '#fff', fontWeight: 600, fontSize: '11px'}}>{selectedNode.type}</span>
                  </div>
                  <div style={{color: '#94a3b8', fontSize: '11px', marginBottom: '1rem'}}>Node ID: {selectedNode.id}</div>

                  {Object.entries(selectedNode.details || {}).map(([k, v]) => (
                    <div key={k} className="row">
                      <span style={{textTransform: 'capitalize'}}>{k.replace(/_/g, ' ')}</span>
                      <span className="val">{typeof v === 'number' ? v.toLocaleString() : String(v)}</span>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{color: '#64748b', fontStyle: 'italic', padding: '1rem 0'}}>Click a node on the canvas to inspect real parameters.</div>
              )}
            </div>

            {/* Right: Active Transaction Corridors */}
            <div className="card">
              <div style={{fontSize: '11px', color: '#94a3b8', fontWeight: 600}}>Transaction Corridors ({g.links.length})</div>
              <div style={{marginTop: '0.6rem'}}>
                {g.links.map((l, i) => (
                  <div key={i} style={{padding: '0.6rem 0', borderBottom: '1px solid rgba(255,255,255,0.04)'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '12px'}}>
                      <span style={{color: '#fff', fontWeight: 600}}>{l.source} &rarr; {l.target}</span>
                      <span style={{color: '#fff', fontWeight: 700}}>{l.status}</span>
                    </div>
                    <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#94a3b8', marginTop: '0.2rem'}}>
                      <span>Type: {l.type}</span>
                      <span>Capital Flow: ₹{Number(l.capital_gap).toLocaleString()}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <DemoSection onUpdate={() => {
            fetch(`${API}/api/graph`).then(r => r.json()).then(d => setG(d.data));
          }} currentOppId="OPP-9001" />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
