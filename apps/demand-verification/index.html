<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Distributed Demand Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="../demo-panel.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a0d; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2rem; line-height: 1.5; }
    a { color: #f8fafc; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.4); }
    a:hover { border-bottom-color: #fff; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 1.5rem; align-items: baseline; }
    .title-nav { font-size: 13px; font-weight: 600; color: #94a3b8; }
    .title-nav strong { color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    @media(max-width: 1024px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #11141c; border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 4px; }
    .card.active { border-color: rgba(255,255,255,0.3); background: #131824; }
    .btn { background: #f8fafc; color: #090a0d; border: 1px solid #fff; padding: 0.5rem 0.9rem; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 2px; }
    .btn:hover { background: #e2e8f0; }
    .btn.reset { background: transparent; color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); margin-left: 0.75rem; }
    .btn.reset:hover { background: rgba(248, 113, 113, 0.1); border-color: #f87171; }
    .stat-row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    .val { color: #fff; font-weight: 600; }
    .meter { height: 4px; background: #1e2638; margin: 1rem 0; border-radius: 2px; overflow: hidden; }
    .fill { height: 100%; background: #38bdf8; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    input, select { background: #090c13; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-size: 11px; padding: 0.45rem; border-radius: 2px; width: 100%; margin-top: 0.2rem; margin-bottom: 0.6rem; }
    label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .hash-badge { font-size: 10px; color: #cbd5e1; word-break: break-all; background: #0c1017; padding: 0.4rem; border-left: 2px solid #64748b; margin-top: 0.5rem; }
    .formula-box { background: #0d1118; border: 1px solid rgba(255,255,255,0.08); padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    function App() {
      const [dossier, setDossier] = React.useState(null);
      const [scoreData, setScoreData] = React.useState(null);

      // Form state for custom parameters
      const [buyerUnits, setBuyerUnits] = React.useState(500);
      const [buyerEscrow, setBuyerEscrow] = React.useState(true);
      const [supplierStock, setSupplierStock] = React.useState(500);
      const [supplierPrice, setSupplierPrice] = React.useState(320);
      const [msmeHours, setMsmeHours] = React.useState(180);
      const [msmeOperators, setMsmeOperators] = React.useState(14);
      const [logisticsScore, setLogisticsScore] = React.useState(98);

      const load = () => {
        fetch(`${API}/api/verification/dossier?id=OPP-9001`)
          .then(r => r.json())
          .then(d => {
            setDossier(d);
            return fetch(`${API}/api/score?id=OPP-9001`);
          })
          .then(r => r.json())
          .then(res => setScoreData(res.data))
          .catch(err => console.error(err));
      };

      React.useEffect(load, []);

      const attest = (type, params) => {
        fetch(`${API}/api/verification/submit`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ opportunity_id: 'OPP-9001', participant_type: type, parameters: params })
        }).then(load);
      };

      const resetProofs = () => {
        fetch(`${API}/api/verification/reset`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ opportunity_id: 'OPP-9001' })
        }).then(load);
      };

      if (!dossier) return <div style={{padding: '2rem'}}>Loading Verification Data...</div>;

      const opp = dossier.opportunity;
      const c = dossier.consensus;
      const proofs = dossier.proofs || [];
      const has = (t) => proofs.some(p => p.participant_type === t);
      const getProof = (t) => proofs.find(p => p.participant_type === t);

      return (
        <div>
          <div className="top">
            <div className="title-nav">
              <a href="../../index.html">&larr; Root</a> &nbsp;&bull;&nbsp; <strong>Distributed Demand Verification</strong>
            </div>
            <div>
              Status: <span style={{color: '#fff', fontWeight: 700}}>{c.status} ({c.percentage})</span>
              <button className="btn reset" onClick={resetProofs} title="Wipes proof table to test live recalculation">Reset Proofs</button>
            </div>
          </div>

          {/* Target Opportunity & Credit Impact */}
          <div className="card" style={{marginBottom: '1.5rem'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '1rem'}}>
              <div>
                <div style={{fontSize: '17px', fontWeight: 700, color: '#fff'}}>{opp.item_description}</div>
                <div style={{color: '#94a3b8', marginTop: '0.2rem'}}>
                  Borrower: <span className="val">{opp.msme_name}</span> &nbsp;&bull;&nbsp; Buyer: <span className="val">{opp.buyer_name}</span> &nbsp;&bull;&nbsp; Supplier: <span className="val">{opp.supplier_name}</span>
                </div>
              </div>
              {scoreData && (
                <div style={{textAlign: 'right', background: '#090c13', border: '1px solid rgba(255, 255, 255, 0.15)', padding: '0.6rem 1rem', borderRadius: '4px'}}>
                  <div style={{fontSize: '11px', color: '#94a3b8'}}>Computed Credit Score</div>
                  <div style={{fontSize: '22px', fontWeight: 700, color: '#fff'}}>{scoreData.score} <span style={{fontSize: '13px', color: '#64748b'}}>/ 900</span></div>
                  <div style={{fontSize: '11px', color: '#cbd5e1'}}>{scoreData.tier}</div>
                </div>
              )}
            </div>

            <div className="meter"><div className="fill" style={{width: c.percentage}}></div></div>
            
            <div style={{display: 'flex', gap: '2.5rem', flexWrap: 'wrap', fontSize: '12px'}}>
              <div>Demanded: <span className="val">{opp.units_demanded} units</span></div>
              <div>Unit Contract Price: <span className="val">₹{Number(opp.unit_target_price).toLocaleString()}</span></div>
              <div>Gross Revenue: <span className="val">₹{(opp.units_demanded * opp.unit_target_price).toLocaleString()}</span></div>
              <div>Capital Gap Required: <span className="val">₹{Number(opp.estimated_financing_required).toLocaleString()}</span></div>
              <div>Consensus Weight: <span className="val">{c.earned_weight} / {c.total_weight} pts</span></div>
            </div>
          </div>

          {/* Mathematical Consensus Formula Box */}
          <div className="formula-box">
            <strong style={{color: '#fff'}}>Consensus Proof Formulation &amp; Digital Signature:</strong>
            <div style={{marginTop: '0.3rem', color: '#94a3b8'}}>
              Consensus Ratio C_R = ∑ (w_i · I_proof) = <strong>{c.percentage}</strong>. 
              Each submission hashes payload data H = SHA256(OppID || PartyType || Timestamp || Payload) and commits atomically to SQLite table <code>verification_proofs</code>.
            </div>
          </div>

          {/* 4 Counterparty Proof Cards */}
          <div className="grid">
            {/* Buyer */}
            <div className={`card ${has('BUYER') ? 'active' : ''}`}>
              <div style={{display: 'flex', justifyContent: 'space-between'}}>
                <span style={{color: '#94a3b8', fontSize: '11px'}}>Buyer (35% weight)</span>
                {has('BUYER') && <span style={{color: '#fff', fontWeight: 600}}>Verified</span>}
              </div>
              <div style={{fontWeight: 700, color: '#fff', margin: '0.4rem 0'}}>{opp.buyer_name}</div>
              
              {!has('BUYER') ? (
                <div>
                  <label>Confirmed Demand Units</label>
                  <input type="number" value={buyerUnits} onChange={e => setBuyerUnits(Number(e.target.value))} />
                  <label>Escrow Commitment</label>
                  <select value={buyerEscrow ? '1' : '0'} onChange={e => setBuyerEscrow(e.target.value === '1')}>
                    <option value="1">Escrow Ready (Direct to Lender)</option>
                    <option value="0">Standard 90-Day Credit</option>
                  </select>
                  <button className="btn" style={{width: '100%', marginTop: '0.5rem'}} onClick={() => attest('BUYER', {confirmed_units: buyerUnits, payment_escrow_ready: buyerEscrow})}>
                    Sign and Attest (+35%)
                  </button>
                </div>
              ) : (
                <div>
                  <div className="stat-row"><span>Units Confirmed</span><span className="val">{JSON.parse(getProof('BUYER').parameters_json).confirmed_units}</span></div>
                  <div className="stat-row"><span>Escrow Locked</span><span className="val">{JSON.parse(getProof('BUYER').parameters_json).payment_escrow_ready ? 'Yes' : 'No'}</span></div>
                  <div className="hash-badge">Hash: {getProof('BUYER').digital_signature}</div>
                </div>
              )}
            </div>

            {/* Supplier */}
            <div className={`card ${has('SUPPLIER') ? 'active' : ''}`}>
              <div style={{display: 'flex', justifyContent: 'space-between'}}>
                <span style={{color: '#94a3b8', fontSize: '11px'}}>Supplier (30% weight)</span>
                {has('SUPPLIER') && <span style={{color: '#fff', fontWeight: 600}}>Verified</span>}
              </div>
              <div style={{fontWeight: 700, color: '#fff', margin: '0.4rem 0'}}>{opp.supplier_name}</div>
              
              {!has('SUPPLIER') ? (
                <div>
                  <label>Allocated Stock Units</label>
                  <input type="number" value={supplierStock} onChange={e => setSupplierStock(Number(e.target.value))} />
                  <label>Locked Unit Cost (INR)</label>
                  <input type="number" value={supplierPrice} onChange={e => setSupplierPrice(Number(e.target.value))} />
                  <button className="btn" style={{width: '100%', marginTop: '0.5rem'}} onClick={() => attest('SUPPLIER', {allocated_stock_units: supplierStock, confirmed_unit_cost: supplierPrice})}>
                    Sign and Attest (+30%)
                  </button>
                </div>
              ) : (
                <div>
                  <div className="stat-row"><span>Stock Allocated</span><span className="val">{JSON.parse(getProof('SUPPLIER').parameters_json).allocated_stock_units} units</span></div>
                  <div className="stat-row"><span>Unit Cost</span><span className="val">₹{JSON.parse(getProof('SUPPLIER').parameters_json).confirmed_unit_cost}</span></div>
                  <div className="hash-badge">Hash: {getProof('SUPPLIER').digital_signature}</div>
                </div>
              )}
            </div>

            {/* MSME */}
            <div className={`card ${has('MSME') ? 'active' : ''}`}>
              <div style={{display: 'flex', justifyContent: 'space-between'}}>
                <span style={{color: '#94a3b8', fontSize: '11px'}}>MSME (25% weight)</span>
                {has('MSME') && <span style={{color: '#fff', fontWeight: 600}}>Verified</span>}
              </div>
              <div style={{fontWeight: 700, color: '#fff', margin: '0.4rem 0'}}>{opp.msme_name}</div>
              
              {!has('MSME') ? (
                <div>
                  <label>Pledged Shift Hours</label>
                  <input type="number" value={msmeHours} onChange={e => setMsmeHours(Number(e.target.value))} />
                  <label>Active Factory Operators</label>
                  <input type="number" value={msmeOperators} onChange={e => setMsmeOperators(Number(e.target.value))} />
                  <button className="btn" style={{width: '100%', marginTop: '0.5rem'}} onClick={() => attest('MSME', {pledged_shift_hours: msmeHours, active_operators: msmeOperators})}>
                    Sign and Attest (+25%)
                  </button>
                </div>
              ) : (
                <div>
                  <div className="stat-row"><span>Pledged Hours</span><span className="val">{JSON.parse(getProof('MSME').parameters_json).pledged_shift_hours} hrs</span></div>
                  <div className="stat-row"><span>Operators Assigned</span><span className="val">{JSON.parse(getProof('MSME').parameters_json).active_operators}</span></div>
                  <div className="hash-badge">Hash: {getProof('MSME').digital_signature}</div>
                </div>
              )}
            </div>

            {/* Logistics */}
            <div className={`card ${has('LOGISTICS') ? 'active' : ''}`}>
              <div style={{display: 'flex', justifyContent: 'space-between'}}>
                <span style={{color: '#94a3b8', fontSize: '11px'}}>Logistics (10% weight)</span>
                {has('LOGISTICS') && <span style={{color: '#fff', fontWeight: 600}}>Verified</span>}
              </div>
              <div style={{fontWeight: 700, color: '#fff', margin: '0.4rem 0'}}>Varanasi Express Freight</div>
              
              {!has('LOGISTICS') ? (
                <div>
                  <label>Corridor Delivery Rating (0-100)</label>
                  <input type="number" value={logisticsScore} onChange={e => setLogisticsScore(Number(e.target.value))} />
                  <label>Vehicle Tracking Assigned</label>
                  <select defaultValue="1">
                    <option value="1">GPS Route Pledged</option>
                  </select>
                  <button className="btn" style={{width: '100%', marginTop: '0.5rem'}} onClick={() => attest('LOGISTICS', {corridor_delivery_rating: logisticsScore, vehicle_assigned: true})}>
                    Sign and Attest (+10%)
                  </button>
                </div>
              ) : (
                <div>
                  <div className="stat-row"><span>Corridor Rating</span><span className="val">{JSON.parse(getProof('LOGISTICS').parameters_json).corridor_delivery_rating}%</span></div>
                  <div className="stat-row"><span>GPS Tracking</span><span className="val">Active</span></div>
                  <div className="hash-badge">Hash: {getProof('LOGISTICS').digital_signature}</div>
                </div>
              )}
            </div>
          </div>

          {/* Verification Audit Log */}
          <div className="card">
            <div style={{color: '#94a3b8', fontSize: '11px', marginBottom: '0.75rem', fontWeight: 600}}>
              Verification Proof Records ({proofs.length} committed to SQLite)
            </div>
            {proofs.length === 0 ? (
              <div style={{color: '#64748b', fontStyle: 'italic'}}>No proofs signed yet. Enter parameters above to sign and attest.</div>
            ) : (
              <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '11px'}}>
                <thead>
                  <tr style={{color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.1)', textAlign: 'left'}}>
                    <th style={{padding: '0.4rem'}}>Participant</th>
                    <th style={{padding: '0.4rem'}}>Weight</th>
                    <th style={{padding: '0.4rem'}}>Payload Attributes</th>
                    <th style={{padding: '0.4rem'}}>Digital Signature (SHA-256)</th>
                    <th style={{padding: '0.4rem'}}>Timestamp</th>
                  </tr>
                </thead>
                <tbody>
                  {proofs.map(p => (
                    <tr key={p.id} style={{borderBottom: '1px solid rgba(255,255,255,0.04)'}}>
                      <td style={{padding: '0.5rem 0.4rem', color: '#fff', fontWeight: 600}}>{p.participant_type}</td>
                      <td style={{padding: '0.5rem 0.4rem', color: '#94a3b8'}}>{p.weight_assigned} pts</td>
                      <td style={{padding: '0.5rem 0.4rem', color: '#cbd5e1'}}>{p.parameters_json}</td>
                      <td style={{padding: '0.5rem 0.4rem', fontFamily: 'monospace', color: '#94a3b8'}}>{p.digital_signature}</td>
                      <td style={{padding: '0.5rem 0.4rem', color: '#64748b'}}>{p.created_at}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          <DemoSection onUpdate={() => load()} currentOppId="OPP-9001" />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
