<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Demand Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a0d; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2rem; line-height: 1.5; }
    a { color: #94a3b8; text-decoration: none; }
    a:hover { color: #fff; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem; margin-bottom: 1.5rem; align-items: baseline; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    @media(max-width: 1024px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #11141c; border: 1px solid rgba(255,255,255,0.08); padding: 1.25rem; border-radius: 4px; }
    .card.active { border-color: rgba(255,255,255,0.25); background: #131824; }
    .btn { background: #fff; color: #090a0d; border: none; padding: 0.5rem 0.9rem; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 2px; }
    .btn:hover { background: #e2e8f0; }
    .btn.reset { background: transparent; color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); margin-left: 0.75rem; }
    .row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
    .val { color: #fff; font-weight: 600; }
    .meter { height: 4px; background: #1e2638; margin: 0.75rem 0 1rem 0; border-radius: 2px; overflow: hidden; }
    .fill { height: 100%; background: #38bdf8; transition: width 0.3s; }
    input { background: #090c13; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-size: 11px; padding: 0.4rem; border-radius: 2px; width: 100%; margin: 0.2rem 0 0.5rem 0; }
    label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    function DemoSection({ onUpdate, currentOppId }) {
      const [open, setOpen] = React.useState(false);
      const [step, setStep] = React.useState(1);
      const [audit, setAudit] = React.useState(null);

      const runStep = (s) => {
        fetch(`${API}/api/demo/execute-step?step=${s}&opportunity_id=${currentOppId}`)
          .then(r => r.json())
          .then(res => {
            setStep(s);
            setAudit(res.audit);
            if (onUpdate) onUpdate();
          });
      };

      return (
        <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 9999 }}>
          {!open ? (
            <button onClick={() => setOpen(true)} className="btn" style={{ padding: '0.5rem 0.9rem', fontSize: '11px', display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#38bdf8' }}></span>
              Demo Steps
            </button>
          ) : (
            <div style={{ width: '320px', background: '#0d1017', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '4px', padding: '1rem', boxShadow: '0 8px 30px rgba(0,0,0,0.8)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.8rem' }}>
                <span style={{ fontWeight: 700, color: '#fff', fontSize: '12px' }}>Interactive Demo</span>
                <span onClick={() => setOpen(false)} style={{ cursor: 'pointer', color: '#94a3b8', fontSize: '14px' }}>&times;</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.3rem', marginBottom: '0.8rem' }}>
                {[1, 2, 3, 4].map(n => (
                  <button key={n} onClick={() => runStep(n)} style={{ background: step === n ? '#1e293b' : '#11141c', color: step === n ? '#fff' : '#64748b', border: '1px solid rgba(255,255,255,0.08)', padding: '0.35rem 0', borderRadius: '2px', cursor: 'pointer', fontSize: '10px' }}>
                    S{n}
                  </button>
                ))}
              </div>
              {audit && (
                <div style={{ fontSize: '11px', color: '#cbd5e1', lineHeight: '1.4' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                    <span>Score: <strong style={{ color: '#fff' }}>{audit.score}</strong></span>
                    <span>Consensus: <strong style={{ color: '#fff' }}>{(audit.consensus_ratio * 100).toFixed(0)}%</strong></span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '10px' }}>{audit.lender_verdict}</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [dossier, setDossier] = React.useState(null);
      const [score, setScore] = React.useState(null);

      const [buyerUnits, setBuyerUnits] = React.useState(500);
      const [supplierStock, setSupplierStock] = React.useState(500);
      const [msmeHours, setMsmeHours] = React.useState(180);
      const [logisticsRating, setLogisticsRating] = React.useState(98);

      const load = () => {
        fetch(`${API}/api/verification/dossier?id=OPP-9001`)
          .then(r => r.json())
          .then(d => {
            setDossier(d);
            return fetch(`${API}/api/score?id=OPP-9001`);
          })
          .then(r => r.json())
          .then(d => setScore(d.data || null))
          .catch(e => console.error(e));
      };

      React.useEffect(load, []);

      const attest = (type, params) => {
        fetch(`${API}/api/verification/submit`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ opportunity_id: 'OPP-9001', participant_type: type, parameters: params })
        }).then(load);
      };

      const reset = () => {
        fetch(`${API}/api/verification/reset`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ opportunity_id: 'OPP-9001' })
        }).then(load);
      };

      if (!dossier) return <div style={{padding: '2rem'}}>Loading...</div>;

      const opp = dossier.opportunity;
      const c = dossier.consensus;
      const proofs = dossier.proofs || [];
      const has = (t) => proofs.some(p => p.participant_type === t);
      const getProof = (t) => proofs.find(p => p.participant_type === t);

      return (
        <div>
          <div className="top">
            <div>
              <a href="../../index.html">&larr; Root</a> &nbsp;&bull;&nbsp; <strong style={{ color: '#fff' }}>Distributed Demand Verification</strong>
            </div>
            <div>
              Consensus: <strong style={{ color: '#fff' }}>{c.percentage}</strong> ({c.status})
              <button className="btn reset" onClick={reset}>Reset</button>
            </div>
          </div>

          {/* Minimal Summary Strip */}
          <div className="card" style={{ marginBottom: '1.5rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <div>
                <div style={{ fontSize: '15px', fontWeight: 700, color: '#fff' }}>{opp.item_description}</div>
                <div style={{ color: '#94a3b8', fontSize: '11px', marginTop: '0.2rem' }}>
                  {opp.msme_name} &nbsp;&bull;&nbsp; {opp.buyer_name} &nbsp;&bull;&nbsp; {opp.supplier_name}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <span style={{ fontSize: '11px', color: '#94a3b8' }}>Credit Score &nbsp;</span>
                <span style={{ fontSize: '18px', fontWeight: 700, color: '#fff' }}>{score ? score.score : 0}</span>
                <span style={{ fontSize: '11px', color: '#64748b' }}> / 900</span>
              </div>
            </div>

            <div className="meter"><div className="fill" style={{ width: c.percentage }}></div></div>

            <div style={{ display: 'flex', gap: '2rem', fontSize: '11px', color: '#94a3b8' }}>
              <div>Volume: <span className="val">{opp.units_demanded} units</span></div>
              <div>Price: <span className="val">₹{opp.unit_target_price}</span></div>
              <div>Capital Gap: <span className="val">₹{Number(opp.estimated_financing_required).toLocaleString()}</span></div>
              <div>Verified Weight: <span className="val">{c.earned_weight} / {c.total_weight} pts</span></div>
            </div>
          </div>

          {/* 4 Clean Cards */}
          <div className="grid">
            {/* Buyer */}
            <div className={`card ${has('BUYER') ? 'active' : ''}`}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                <span style={{ fontSize: '11px', color: '#94a3b8' }}>Buyer (35%)</span>
                {has('BUYER') && <span style={{ color: '#fff', fontWeight: 600, fontSize: '11px' }}>Attested</span>}
              </div>
              <div style={{ fontWeight: 700, color: '#fff', marginBottom: '0.6rem' }}>{opp.buyer_name}</div>
              {!has('BUYER') ? (
                <div>
                  <label>Confirmed Units</label>
                  <input type="number" value={buyerUnits} onChange={e => setBuyerUnits(Number(e.target.value))} />
                  <button className="btn" style={{ width: '100%' }} onClick={() => attest('BUYER', { confirmed_units: buyerUnits, payment_escrow_ready: true })}>
                    Attest
                  </button>
                </div>
              ) : (
                <div style={{ fontSize: '11px', color: '#94a3b8' }}>
                  <div className="row"><span>Units</span><span className="val">{JSON.parse(getProof('BUYER').parameters_json).confirmed_units}</span></div>
                  <div className="row"><span>Escrow</span><span className="val">Locked</span></div>
                </div>
              )}
            </div>

            {/* Supplier */}
            <div className={`card ${has('SUPPLIER') ? 'active' : ''}`}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                <span style={{ fontSize: '11px', color: '#94a3b8' }}>Supplier (30%)</span>
                {has('SUPPLIER') && <span style={{ color: '#fff', fontWeight: 600, fontSize: '11px' }}>Attested</span>}
              </div>
              <div style={{ fontWeight: 700, color: '#fff', marginBottom: '0.6rem' }}>{opp.supplier_name}</div>
              {!has('SUPPLIER') ? (
                <div>
                  <label>Stock Units</label>
                  <input type="number" value={supplierStock} onChange={e => setSupplierStock(Number(e.target.value))} />
                  <button className="btn" style={{ width: '100%' }} onClick={() => attest('SUPPLIER', { allocated_stock_units: supplierStock, confirmed_unit_cost: 320 })}>
                    Attest
                  </button>
                </div>
              ) : (
                <div style={{ fontSize: '11px', color: '#94a3b8' }}>
                  <div className="row"><span>Allocated</span><span className="val">{JSON.parse(getProof('SUPPLIER').parameters_json).allocated_stock_units}</span></div>
                  <div className="row"><span>Cost</span><span className="val">₹320/u</span></div>
                </div>
              )}
            </div>

            {/* MSME */}
            <div className={`card ${has('MSME') ? 'active' : ''}`}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                <span style={{ fontSize: '11px', color: '#94a3b8' }}>MSME (25%)</span>
                {has('MSME') && <span style={{ color: '#fff', fontWeight: 600, fontSize: '11px' }}>Attested</span>}
              </div>
              <div style={{ fontWeight: 700, color: '#fff', marginBottom: '0.6rem' }}>{opp.msme_name}</div>
              {!has('MSME') ? (
                <div>
                  <label>Shift Hours</label>
                  <input type="number" value={msmeHours} onChange={e => setMsmeHours(Number(e.target.value))} />
                  <button className="btn" style={{ width: '100%' }} onClick={() => attest('MSME', { pledged_shift_hours: msmeHours, active_operators: 14 })}>
                    Attest
                  </button>
                </div>
              ) : (
                <div style={{ fontSize: '11px', color: '#94a3b8' }}>
                  <div className="row"><span>Pledged</span><span className="val">{JSON.parse(getProof('MSME').parameters_json).pledged_shift_hours} hrs</span></div>
                  <div className="row"><span>Operators</span><span className="val">14 Active</span></div>
                </div>
              )}
            </div>

            {/* Logistics */}
            <div className={`card ${has('LOGISTICS') ? 'active' : ''}`}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                <span style={{ fontSize: '11px', color: '#94a3b8' }}>Logistics (10%)</span>
                {has('LOGISTICS') && <span style={{ color: '#fff', fontWeight: 600, fontSize: '11px' }}>Attested</span>}
              </div>
              <div style={{ fontWeight: 700, color: '#fff', marginBottom: '0.6rem' }}>Corridor Logistics</div>
              {!has('LOGISTICS') ? (
                <div>
                  <label>Corridor Score (0-100)</label>
                  <input type="number" value={logisticsRating} onChange={e => setLogisticsRating(Number(e.target.value))} />
                  <button className="btn" style={{ width: '100%' }} onClick={() => attest('LOGISTICS', { corridor_delivery_rating: logisticsRating, vehicle_assigned: true })}>
                    Attest
                  </button>
                </div>
              ) : (
                <div style={{ fontSize: '11px', color: '#94a3b8' }}>
                  <div className="row"><span>Rating</span><span className="val">{JSON.parse(getProof('LOGISTICS').parameters_json).corridor_delivery_rating}%</span></div>
                  <div className="row"><span>Tracking</span><span className="val">GPS Active</span></div>
                </div>
              )}
            </div>
          </div>

          {/* Simple Proofs Table */}
          <div className="card">
            <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 600, marginBottom: '0.5rem' }}>
              Proof Ledger ({proofs.length})
            </div>
            {proofs.length === 0 ? (
              <div style={{ color: '#64748b', fontSize: '11px' }}>No proofs submitted.</div>
            ) : (
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}>
                <thead>
                  <tr style={{ color: '#94a3b8', borderBottom: '1px solid rgba(255,255,255,0.08)', textAlign: 'left' }}>
                    <th style={{ padding: '0.3rem' }}>Party</th>
                    <th style={{ padding: '0.3rem' }}>Weight</th>
                    <th style={{ padding: '0.3rem' }}>Signature</th>
                    <th style={{ padding: '0.3rem' }}>Time</th>
                  </tr>
                </thead>
                <tbody>
                  {proofs.map(p => (
                    <tr key={p.id} style={{ borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
                      <td style={{ padding: '0.4rem 0.3rem', color: '#fff', fontWeight: 600 }}>{p.participant_type}</td>
                      <td style={{ padding: '0.4rem 0.3rem', color: '#94a3b8' }}>{p.weight_assigned} pts</td>
                      <td style={{ padding: '0.4rem 0.3rem', color: '#64748b', fontFamily: 'monospace' }}>{p.digital_signature.slice(0, 24)}...</td>
                      <td style={{ padding: '0.4rem 0.3rem', color: '#64748b' }}>{p.verified_at || p.created_at}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          <DemoSection onUpdate={load} currentOppId="OPP-9001" />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
