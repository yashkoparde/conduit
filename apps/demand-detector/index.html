<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Unfulfilled Demand Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07090e;
      --card-bg: #0d111a;
      --card-match: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.2);
      --green: #00e599;
      --amber: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', -apple-system, sans-serif;
      --display: 'Space Grotesk', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.07), transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(0, 229, 153, 0.03), transparent 50%);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 1.75rem 2.25rem;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--muted); text-decoration: none; transition: color 0.15s; }
    a:hover { color: #fff; }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-pill {
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      letter-spacing: 0.08em;
    }

    /* Action Buttons */
    .btn {
      background: #fff;
      color: #090a0d;
      border: 1px solid #fff;
      padding: 0.5rem 0.9rem;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #e2e8f0; }
    .btn.btn-cyan {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #07090e;
    }
    .btn.btn-cyan:hover {
      background: #7dd3fc;
      border-color: #7dd3fc;
      box-shadow: 0 0 14px var(--cyan-glow);
    }
    .btn.btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Metric Strip */
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    .metric-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .metric-val { font-size: 16px; font-weight: 700; color: #fff; margin-top: 0.2rem; }

    /* Matches Grid */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.1rem;
      margin-bottom: 1.6rem;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 1.25rem;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .match-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: var(--card-match);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .match-title {
      font-family: var(--display);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }
    .match-id {
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 11px;
    }
    .val { color: #fff; font-weight: 600; }

    /* Two-column sub feed */
    .feed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem;
    }
    @media(max-width: 900px) { .feed-grid { grid-template-columns: 1fr; } }

    .feed-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
    }
    .feed-title {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.85rem;
    }

    .list-item {
      background: #090c13;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.6rem;
      transition: all 0.15s;
    }
    .list-item:hover { border-color: rgba(255, 255, 255, 0.15); }

    input, select {
      background: #090c13;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      font-family: inherit;
      font-size: 11px;
      padding: 0.45rem 0.6rem;
      border-radius: 4px;
      width: 100%;
    }
    label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    // Interactive Demo Simulation Steps Floating Controller
    function DemoSection({ onUpdate, currentOppId = 'OPP-9001' }) {
      const [open, setOpen] = React.useState(false);
      const [step, setStep] = React.useState(1);
      const [audit, setAudit] = React.useState(null);
      const [loading, setLoading] = React.useState(false);

      const runStep = (s) => {
        setLoading(true);
        fetch(`${API}/api/demo/execute-step?step=${s}&opportunity_id=${currentOppId}`)
          .then(r => r.json())
          .then(res => {
            setLoading(false);
            setStep(s);
            setAudit(res.audit);
            if (onUpdate) onUpdate();
          })
          .catch(() => setLoading(false));
      };

      return (
        <div style={{ position: 'fixed', bottom: '24px', right: '24px', zIndex: 9999 }}>
          {!open ? (
            <button 
              onClick={() => setOpen(true)} 
              className="btn btn-cyan" 
              style={{ padding: '0.65rem 1.15rem', boxShadow: '0 6px 24px rgba(0,0,0,0.6)' }}
            >
              <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: '#090a0d' }}></span>
              Demo Simulation Steps
            </button>
          ) : (
            <div style={{ width: '340px', background: '#0d111a', border: '1px solid rgba(255,255,255,0.18)', borderRadius: '6px', padding: '1.1rem', boxShadow: '0 12px 40px rgba(0,0,0,0.85)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.9rem' }}>
                <span style={{ fontWeight: 700, color: '#fff', fontSize: '12px' }}>Interactive Stepper</span>
                <span onClick={() => setOpen(false)} style={{ cursor: 'pointer', color: '#94a3b8', fontSize: '16px', lineHeight: 1 }}>&times;</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.4rem', marginBottom: '0.9rem' }}>
                {[1, 2, 3, 4].map(n => (
                  <button 
                    key={n} 
                    onClick={() => runStep(n)} 
                    style={{ 
                      background: step === n ? '#1e293b' : '#090c13', 
                      color: step === n ? '#fff' : '#64748b', 
                      border: step === n ? '1px solid var(--cyan)' : '1px solid rgba(255,255,255,0.08)', 
                      padding: '0.45rem 0', 
                      borderRadius: '3px', 
                      cursor: 'pointer', 
                      fontSize: '11px',
                      fontWeight: 700
                    }}
                  >
                    Step {n}
                  </button>
                ))}
              </div>
              {audit && (
                <div style={{ fontSize: '11px', color: '#cbd5e1', background: '#07090e', padding: '0.75rem', borderRadius: '4px', border: '1px solid rgba(255,255,255,0.06)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                    <span>Score: <strong style={{ color: '#fff' }}>{audit.score}</strong></span>
                    <span>Consensus: <strong style={{ color: 'var(--cyan)' }}>{(audit.consensus_ratio * 100).toFixed(0)}%</strong></span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '10px', marginTop: '0.3rem' }}>{audit.lender_verdict}</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [feed, setFeed] = React.useState(null);
      const [showAddOrder, setShowAddOrder] = React.useState(false);
      const [itemDesc, setItemDesc] = React.useState('Precision High-Temp Heat Sleeves');
      const [units, setUnits] = React.useState(450);
      const [price, setPrice] = React.useState(920);

      const load = () => {
        fetch(`${API}/api/demand-detector/feed`)
          .then(r => r.json())
          .then(d => setFeed(d.feed));
      };

      React.useEffect(load, []);

      const runScan = () => {
        fetch(`${API}/api/demand-detector/run`, { method: 'POST' }).then(load);
      };

      const submitOrder = (e) => {
        e.preventDefault();
        fetch(`${API}/api/demand-orders/create`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ buyer_id: 'BUY-201', item_description: itemDesc, units_demanded: Number(units), unit_target_price: Number(price) })
        }).then(() => {
          setShowAddOrder(false);
          load();
        });
      };

      if (!feed) return (
        <div style={{ padding: '3rem', color: var(--muted), display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: 'var(--cyan)' }}></span>
          Loading Demand Detector Feed...
        </div>
      );

      const s = feed.stats;
      const opps = feed.opportunities || [];
      const orders = feed.orders || [];
      const msmes = feed.msmes || [];

      return (
        <div>
          {/* Top Bar */}
          <div className="top-bar">
            <div className="brand-wrap">
              <a href="../../index.html">&larr; Root Hub</a>
              <span style={{ color: 'var(--dim)' }}>/</span>
              <span className="brand-pill">ELEMENT 03</span>
              <strong style={{ color: '#fff', fontSize: '13px' }}>Unfulfilled Demand Detector</strong>
            </div>

            <div style={{ display: 'flex', gap: '0.75rem' }}>
              <button className="btn btn-secondary" onClick={() => setShowAddOrder(!showAddOrder)}>
                {showAddOrder ? 'Cancel' : '+ New Institutional Order'}
              </button>
              <button className="btn btn-cyan" onClick={runScan}>
                Trigger Match Scanner
              </button>
            </div>
          </div>

          {/* Metric Strip */}
          <div className="metric-strip">
            <div>
              <div className="metric-label">Demanded Units</div>
              <div className="metric-val">{s.demand_units.toLocaleString()} units</div>
            </div>
            <div>
              <div className="metric-label">Available Idle Headroom</div>
              <div className="metric-val" style={{ color: 'var(--green)' }}>{s.idle_capacity_units.toLocaleString()} units</div>
            </div>
            <div>
              <div className="metric-label">Identified Match Triads</div>
              <div className="metric-val" style={{ color: 'var(--cyan)' }}>{s.opportunity_count} Opportunities</div>
            </div>
            <div>
              <div className="metric-label">Total Capital Gap</div>
              <div className="metric-val">₹{s.capital_required_inr.toLocaleString()}</div>
            </div>
          </div>

          {/* New Order Modal / Drawer */}
          {showAddOrder && (
            <div style={{ background: '#111827', border: '1px solid var(--cyan)', padding: '1.25rem', borderRadius: '6px', marginBottom: '1.5rem' }}>
              <div style={{ fontWeight: 700, color: '#fff', marginBottom: '0.8rem', fontSize: '14px' }}>Submit Verified Buyer Demand Order</div>
              <form onSubmit={submitOrder} style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr auto', gap: '1rem', alignItems: 'end' }}>
                <div>
                  <label>Item Description / Specification</label>
                  <input type="text" value={itemDesc} onChange={e => setItemDesc(e.target.value)} required />
                </div>
                <div>
                  <label>Units Demanded</label>
                  <input type="number" value={units} onChange={e => setUnits(e.target.value)} required />
                </div>
                <div>
                  <label>Unit Target Price (INR)</label>
                  <input type="number" value={price} onChange={e => setPrice(e.target.value)} required />
                </div>
                <div>
                  <button type="submit" className="btn btn-cyan" style={{ height: '36px' }}>Commit Order</button>
                </div>
              </form>
            </div>
          )}

          {/* Matches Grid */}
          <div style={{ fontSize: '11px', color: 'var(--muted)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '0.75rem' }}>
            Discovered Opportunity Matches ({opps.length})
          </div>

          <div className="matches-grid">
            {opps.map(o => (
              <div key={o.id} className="match-card">
                <div>
                  <div className="match-header">
                    <span className="match-title">{o.item_description}</span>
                    <span className="match-id">{o.id}</span>
                  </div>
                  <div style={{ color: 'var(--dim)', fontSize: '11px', marginBottom: '0.75rem' }}>
                    Producer: <strong style={{ color: '#fff' }}>{o.business_name}</strong> ({o.location})
                  </div>

                  <div className="row"><span>Buyer</span><span className="val">{o.buyer_name}</span></div>
                  <div className="row"><span>Volume (Demanded / Headroom)</span><span className="val">{o.demanded_units} / {o.idle_capacity} units</span></div>
                  <div className="row"><span>Target Contract Price</span><span className="val">₹{o.unit_target_price} / unit</span></div>
                  <div className="row"><span>Estimated Capital Gap</span><span className="val" style={{ color: 'var(--cyan)' }}>₹{Number(o.estimated_financing_required).toLocaleString()}</span></div>
                  <div className="row"><span>Assigned Supplier</span><span className="val">{o.supplier_name || 'Pending'}</span></div>
                </div>

                <div style={{ marginTop: '1rem', display: 'flex', gap: '0.5rem', paddingTop: '0.75rem', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
                  <a href="/apps/demand-verification/index.html" className="btn btn-cyan" style={{ flex: 1, fontSize: '10px' }}>
                    Attest Proofs &rarr;
                  </a>
                  <a href="/apps/capital-simulator/index.html" className="btn btn-secondary" style={{ flex: 1, fontSize: '10px' }}>
                    Simulate ROI
                  </a>
                  <a href="/apps/loan-designer/index.html" className="btn btn-secondary" style={{ flex: 1, fontSize: '10px' }}>
                    Loan Terms
                  </a>
                </div>
              </div>
            ))}
          </div>

          {/* Two-Column Feeds */}
          <div className="feed-grid">
            <div className="feed-card">
              <div className="feed-title">Verified Buyer Demand Stream ({orders.length})</div>
              {orders.map(o => (
                <div key={o.id} className="list-item">
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#fff', fontWeight: 600, fontSize: '12px' }}>
                    <span>{o.item_description}</span>
                    <span style={{ color: 'var(--cyan)' }}>{o.units_demanded} units</span>
                  </div>
                  <div style={{ color: 'var(--dim)', fontSize: '11px', marginTop: '0.2rem' }}>
                    Buyer: {o.buyer_name} &bull; Target: ₹{o.unit_target_price} &bull; Due: {o.delivery_deadline}
                  </div>
                </div>
              ))}
            </div>

            <div className="feed-card">
              <div className="feed-title">Attested MSME Producers ({msmes.length})</div>
              {msmes.map(m => {
                const idle = m.max_monthly_capacity - m.current_production;
                return (
                  <div key={m.id} className="list-item">
                    <div style={{ display: 'flex', justifyContent: 'space-between', color: '#fff', fontWeight: 600, fontSize: '12px' }}>
                      <span>{m.business_name}</span>
                      <span style={{ color: 'var(--green)' }}>{idle} idle headroom</span>
                    </div>
                    <div style={{ color: 'var(--dim)', fontSize: '11px', marginTop: '0.2rem' }}>
                      Sector: {m.industry} &bull; Loc: {m.location} &bull; Bottleneck: {m.capital_bottleneck}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <DemoSection onUpdate={load} currentOppId="OPP-9001" />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
