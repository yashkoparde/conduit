<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Demand Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a0d; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2rem; line-height: 1.5; }
    a { color: #94a3b8; text-decoration: none; }
    a:hover { color: #fff; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem; margin-bottom: 1.5rem; align-items: baseline; }
    .stats { display: flex; gap: 2rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.08); padding: 0.8rem 1rem; background: #11141c; border-radius: 4px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #11141c; border: 1px solid rgba(255,255,255,0.08); padding: 1rem; border-radius: 4px; margin-bottom: 0.8rem; }
    .card.opportunity { border-left: 2px solid #38bdf8; }
    .btn { background: #fff; color: #090a0d; border: none; padding: 0.45rem 0.85rem; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 2px; }
    .btn:hover { background: #e2e8f0; }
    .btn-secondary { background: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.2); }
    .row { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .val { color: #fff; font-weight: 600; }
    input, select { background: #090c13; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-size: 11px; padding: 0.4rem; border-radius: 2px; width: 100%; margin: 0.2rem 0 0.5rem 0; }
    label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    function DemoSection({ onUpdate, currentOppId }) {
      const [open, setOpen] = React.useState(false);
      const [step, setStep] = React.useState(1);
      const [audit, setAudit] = React.useState(null);

      const runStep = (s) => {
        fetch(`${API}/api/demo/execute-step?step=${s}&opportunity_id=${currentOppId}`)
          .then(r => r.json())
          .then(res => {
            setStep(s);
            setAudit(res.audit);
            if (onUpdate) onUpdate();
          });
      };

      return (
        <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 9999 }}>
          {!open ? (
            <button onClick={() => setOpen(true)} className="btn" style={{ padding: '0.5rem 0.9rem', fontSize: '11px', display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#38bdf8' }}></span>
              Demo Steps
            </button>
          ) : (
            <div style={{ width: '320px', background: '#0d1017', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '4px', padding: '1rem', boxShadow: '0 8px 30px rgba(0,0,0,0.8)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.8rem' }}>
                <span style={{ fontWeight: 700, color: '#fff', fontSize: '12px' }}>Interactive Demo</span>
                <span onClick={() => setOpen(false)} style={{ cursor: 'pointer', color: '#94a3b8', fontSize: '14px' }}>&times;</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.3rem', marginBottom: '0.8rem' }}>
                {[1, 2, 3, 4].map(n => (
                  <button key={n} onClick={() => runStep(n)} style={{ background: step === n ? '#1e293b' : '#11141c', color: step === n ? '#fff' : '#64748b', border: '1px solid rgba(255,255,255,0.08)', padding: '0.35rem 0', borderRadius: '2px', cursor: 'pointer', fontSize: '10px' }}>
                    S{n}
                  </button>
                ))}
              </div>
              {audit && (
                <div style={{ fontSize: '11px', color: '#cbd5e1', lineHeight: '1.4' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                    <span>Score: <strong style={{ color: '#fff' }}>{audit.score}</strong></span>
                    <span>Consensus: <strong style={{ color: '#fff' }}>{(audit.consensus_ratio * 100).toFixed(0)}%</strong></span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '10px' }}>{audit.lender_verdict}</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [feed, setFeed] = React.useState(null);
      const [showAddOrder, setShowAddOrder] = React.useState(false);
      const [itemDesc, setItemDesc] = React.useState('Cotton Twill Shirts');
      const [units, setUnits] = React.useState(350);
      const [price, setPrice] = React.useState(750);

      const load = () => {
        fetch(`${API}/api/demand-detector/feed`)
          .then(r => r.json())
          .then(d => setFeed(d.feed));
      };

      React.useEffect(load, []);

      const runScan = () => {
        fetch(`${API}/api/demand-detector/run`, { method: 'POST' }).then(load);
      };

      const submitOrder = (e) => {
        e.preventDefault();
        fetch(`${API}/api/demand-orders/create`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ buyer_id: 'BUYER-01', item_description: itemDesc, units_demanded: Number(units), unit_target_price: Number(price) })
        }).then(() => {
          setShowAddOrder(false);
          load();
        });
      };

      if (!feed) return <div style={{padding: '2rem'}}>Loading...</div>;

      const s = feed.stats;
      const opps = feed.opportunities || [];
      const orders = feed.orders || [];
      const msmes = feed.msmes || [];

      return (
        <div>
          <div className="top">
            <div>
              <a href="../../index.html">&larr; Root</a> &nbsp;&bull;&nbsp; <strong style={{ color: '#fff' }}>Unfulfilled Demand Detector</strong>
            </div>
            <div style={{ display: 'flex', gap: '0.5rem' }}>
              <button className="btn btn-secondary" onClick={() => setShowAddOrder(!showAddOrder)}>+ Add Order</button>
              <button className="btn" onClick={runScan}>Match</button>
            </div>
          </div>

          {/* Minimal Stats */}
          <div className="stats">
            <div>Demanded: <span className="val">{s.demand_units} units</span></div>
            <div>Idle Capacity: <span className="val">{s.idle_capacity_units} units</span></div>
            <div>Matches: <span className="val">{s.opportunity_count}</span></div>
            <div>Capital Gap: <span className="val">₹{s.capital_required_inr.toLocaleString()}</span></div>
          </div>

          {showAddOrder && (
            <div className="card" style={{ marginBottom: '1.2rem', padding: '1rem' }}>
              <form onSubmit={submitOrder} style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr auto', gap: '0.8rem', alignItems: 'end' }}>
                <div>
                  <label>Item Description</label>
                  <input type="text" value={itemDesc} onChange={e => setItemDesc(e.target.value)} required />
                </div>
                <div>
                  <label>Units</label>
                  <input type="number" value={units} onChange={e => setUnits(e.target.value)} required />
                </div>
                <div>
                  <label>Price (₹)</label>
                  <input type="number" value={price} onChange={e => setPrice(e.target.value)} required />
                </div>
                <div>
                  <button type="submit" className="btn" style={{ marginBottom: '0.5rem' }}>Save</button>
                </div>
              </form>
            </div>
          )}

          {/* Matches List */}
          <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 600, marginBottom: '0.6rem' }}>
            Detected Opportunities ({opps.length})
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '0.8rem', marginBottom: '1.5rem' }}>
            {opps.map(o => (
              <div key={o.id} className="card opportunity">
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ fontWeight: 700, color: '#fff' }}>{o.item_description}</span>
                  <span style={{ fontSize: '10px', color: '#38bdf8' }}>{o.id}</span>
                </div>
                <div style={{ color: '#94a3b8', fontSize: '11px', margin: '0.2rem 0 0.5rem 0' }}>{o.business_name} ({o.location})</div>
                <div className="row"><span>Demanded / Idle</span><span className="val">{o.demanded_units} / {o.idle_capacity} units</span></div>
                <div className="row"><span>Capital Gap</span><span className="val">₹{Number(o.estimated_financing_required).toLocaleString()}</span></div>
                <div style={{ marginTop: '0.6rem', display: 'flex', gap: '0.5rem' }}>
                  <a href="/apps/demand-verification/index.html" className="btn" style={{ fontSize: '10px' }}>Verify Proofs</a>
                  <a href="/apps/loan-designer/index.html" className="btn btn-secondary" style={{ fontSize: '10px' }}>Loan Terms</a>
                </div>
              </div>
            ))}
          </div>

          {/* Raw Order vs MSME Feed */}
          <div className="grid">
            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 600, marginBottom: '0.5rem' }}>Demand Orders ({orders.length})</div>
              {orders.map(o => (
                <div key={o.id} className="card" style={{ padding: '0.8rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#fff', fontWeight: 600 }}>
                    <span>{o.item_description}</span>
                    <span>{o.units_demanded} u</span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '11px' }}>{o.buyer_name} &nbsp;&bull;&nbsp; ₹{o.unit_target_price}</div>
                </div>
              ))}
            </div>

            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 600, marginBottom: '0.5rem' }}>Producers ({msmes.length})</div>
              {msmes.map(m => (
                <div key={m.id} className="card" style={{ padding: '0.8rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#fff', fontWeight: 600 }}>
                    <span>{m.business_name}</span>
                    <span>{m.max_monthly_capacity - m.current_production} idle</span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '11px' }}>{m.industry} &nbsp;&bull;&nbsp; {m.location}</div>
                </div>
              ))}
            </div>
          </div>

          <DemoSection onUpdate={load} currentOppId="OPP-9001" />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
