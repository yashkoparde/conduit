<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Gap Intelligence Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a0d; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2rem; line-height: 1.5; }
    a { color: #94a3b8; text-decoration: none; }
    a:hover { color: #fff; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem; margin-bottom: 1.5rem; align-items: baseline; }
    .stats { display: flex; gap: 2.5rem; background: #11141c; padding: 0.9rem 1.2rem; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; margin-bottom: 1.5rem; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #11141c; border: 1px solid rgba(255,255,255,0.08); padding: 1.1rem; border-radius: 4px; margin-bottom: 0.8rem; }
    .row { display: flex; justify-content: space-between; padding: 0.35rem 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .val { color: #fff; font-weight: 600; }
    .meter { height: 4px; background: #1e2638; margin: 0.5rem 0 0.8rem 0; border-radius: 2px; overflow: hidden; }
    .fill { height: 100%; background: #38bdf8; }
    .btn { background: #fff; color: #090a0d; border: none; padding: 0.45rem 0.85rem; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    function DemoSection({ onUpdate, currentOppId }) {
      const [open, setOpen] = React.useState(false);
      const [step, setStep] = React.useState(1);
      const [audit, setAudit] = React.useState(null);

      const runStep = (s) => {
        fetch(`${API}/api/demo/execute-step?step=${s}&opportunity_id=${currentOppId}`)
          .then(r => r.json())
          .then(res => {
            setStep(s);
            setAudit(res.audit);
            if (onUpdate) onUpdate();
          });
      };

      return (
        <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 9999 }}>
          {!open ? (
            <button onClick={() => setOpen(true)} className="btn" style={{ padding: '0.5rem 0.9rem', fontSize: '11px', display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#38bdf8' }}></span>
              Demo Steps
            </button>
          ) : (
            <div style={{ width: '320px', background: '#0d1017', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '4px', padding: '1rem', boxShadow: '0 8px 30px rgba(0,0,0,0.8)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.8rem' }}>
                <span style={{ fontWeight: 700, color: '#fff', fontSize: '12px' }}>Interactive Demo</span>
                <span onClick={() => setOpen(false)} style={{ cursor: 'pointer', color: '#94a3b8', fontSize: '14px' }}>&times;</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.3rem', marginBottom: '0.8rem' }}>
                {[1, 2, 3, 4].map(n => (
                  <button key={n} onClick={() => runStep(n)} style={{ background: step === n ? '#1e293b' : '#11141c', color: step === n ? '#fff' : '#64748b', border: '1px solid rgba(255,255,255,0.08)', padding: '0.35rem 0', borderRadius: '2px', cursor: 'pointer', fontSize: '10px' }}>
                    S{n}
                  </button>
                ))}
              </div>
              {audit && (
                <div style={{ fontSize: '11px', color: '#cbd5e1', lineHeight: '1.4' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                    <span>Score: <strong style={{ color: '#fff' }}>{audit.score}</strong></span>
                    <span>Consensus: <strong style={{ color: '#fff' }}>{(audit.consensus_ratio * 100).toFixed(0)}%</strong></span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '10px' }}>{audit.lender_verdict}</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [res, setRes] = React.useState(null);
      const [selectedOppId, setSelectedOppId] = React.useState('OPP-9001');

      const load = () => {
        fetch(`${API}/api/gap-engine/analyze`).then(r => r.json()).then(d => setRes(d.data));
      };

      React.useEffect(load, []);

      if (!res) return <div style={{padding: '2rem'}}>Loading...</div>;

      const m = res.summary_metrics;
      const c = res.producer_clusters || [];
      const t = res.economic_triads || [];

      return (
        <div>
          <div className="top">
            <div>
              <a href="../../index.html">&larr; Root</a> &nbsp;&bull;&nbsp; <strong style={{ color: '#fff' }}>Gap Intelligence Engine</strong>
            </div>
            <div style={{ color: '#94a3b8', fontSize: '12px' }}>
              Selected Triad: <strong style={{ color: '#38bdf8' }}>{selectedOppId}</strong> &bull; Status: <strong style={{ color: '#fff' }}>Online</strong>
            </div>
          </div>

          {/* Minimal Metrics Strip */}
          <div className="stats">
            <div>Clusters: <span className="val">{m.total_analyzed_clusters}</span></div>
            <div>Active Triads: <span className="val">{m.active_economic_triads}</span></div>
            <div>Capital Blocked: <span className="val">₹{m.total_capital_blocked_inr.toLocaleString()}</span></div>
            <div>Potential GDP Expansion: <span className="val">₹{m.total_potential_gdp_unlock_inr.toLocaleString()}</span></div>
          </div>

          <div className="grid">
            {/* Producer Headroom */}
            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 600, marginBottom: '0.6rem' }}>Producer Utilization</div>
              {c.map(p => (
                <div key={p.msme_id} className="card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                    <span style={{ fontWeight: 700, color: '#fff' }}>{p.business_name}</span>
                    <span style={{ color: '#fff', fontSize: '12px', fontWeight: 600 }}>{p.utilization_rate}</span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '11px', margin: '0.2rem 0' }}>{p.industry} &nbsp;&bull;&nbsp; {p.location}</div>
                  
                  <div className="meter"><div className="fill" style={{ width: p.utilization_rate }}></div></div>

                  <div className="row"><span>Capacity (Max / Current)</span><span className="val">{p.max_capacity} / {p.current_production}</span></div>
                  <div className="row"><span>Idle Equipment Headroom</span><span className="val">{p.idle_capacity} units</span></div>
                  <div className="row"><span>Bottleneck</span><span className="val">{p.bottleneck}</span></div>
                </div>
              ))}
            </div>

            {/* Economic Triads */}
            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8', fontWeight: 600, marginBottom: '0.6rem' }}>Economic Triads ({t.length})</div>
              {t.map(x => (
                <div 
                  key={x.triad_id} 
                  className="card" 
                  onClick={() => setSelectedOppId(x.triad_id)}
                  style={{ 
                    cursor: 'pointer', 
                    borderLeft: selectedOppId === x.triad_id ? '3px solid #38bdf8' : '1px solid rgba(255,255,255,0.08)',
                    background: selectedOppId === x.triad_id ? '#131824' : '#11141c'
                  }}
                >
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 700, color: '#fff', marginBottom: '0.4rem' }}>
                    <span>{x.demand.item}</span>
                    <span style={{ color: '#38bdf8', fontSize: '11px' }}>{x.triad_id}</span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '11px', marginBottom: '0.6rem' }}>
                    {x.buyer.name} &rarr; {x.msme.name} &rarr; {x.supplier.name}
                  </div>
                  <div className="row"><span>Contract Value</span><span className="val">₹{x.demand.total_value.toLocaleString()}</span></div>
                  <div className="row"><span>Capital Gap Unlocked</span><span className="val">₹{x.unlocked_capital_required.toLocaleString()}</span></div>
                  <div className="row"><span>Projected Economic GDP Multiplier (1.75x)</span><span className="val">₹{x.projected_gdp_impact.toLocaleString()}</span></div>
                  <div className="row"><span>Status</span><span className="val" style={{ color: x.status === 'FINANCED' ? '#38bdf8' : '#e2e8f0' }}>{x.status}</span></div>
                </div>
              ))}
            </div>
          </div>

          <DemoSection onUpdate={load} currentOppId={selectedOppId} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
