<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONDUIT — Capital Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090a0d; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 2rem; line-height: 1.5; }
    a { color: #94a3b8; text-decoration: none; }
    a:hover { color: #fff; }
    .top { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem; margin-bottom: 1.5rem; align-items: baseline; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; background: #11141c; border: 1px solid rgba(255,255,255,0.08); padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    @media(max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { background: #11141c; border: 1px solid rgba(255,255,255,0.08); padding: 1.25rem; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between; }
    .card.optimal { border-color: rgba(255,255,255,0.3); background: #131824; }
    .row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
    .val { color: #fff; font-weight: 600; }
    .btn { background: #fff; color: #090a0d; border: none; padding: 0.45rem 0.85rem; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 2px; }
    input[type=range] { accent-color: #38bdf8; width: 100%; margin: 0.3rem 0; }
    select { background: #090c13; border: 1px solid rgba(255,255,255,0.15); color: #fff; font-family: inherit; font-size: 11px; padding: 0.35rem; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const API = 'http://127.0.0.1:8088';

    function DemoSection({ onUpdate, currentOppId }) {
      const [open, setOpen] = React.useState(false);
      const [step, setStep] = React.useState(1);
      const [audit, setAudit] = React.useState(null);

      const runStep = (s) => {
        fetch(`${API}/api/demo/execute-step?step=${s}&opportunity_id=${currentOppId}`)
          .then(r => r.json())
          .then(res => {
            setStep(s);
            setAudit(res.audit);
            if (onUpdate) onUpdate();
          });
      };

      return (
        <div style={{ position: 'fixed', bottom: '20px', right: '20px', zIndex: 9999 }}>
          {!open ? (
            <button onClick={() => setOpen(true)} className="btn" style={{ padding: '0.5rem 0.9rem', fontSize: '11px', display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#38bdf8' }}></span>
              Demo Steps
            </button>
          ) : (
            <div style={{ width: '320px', background: '#0d1017', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '4px', padding: '1rem', boxShadow: '0 8px 30px rgba(0,0,0,0.8)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.8rem' }}>
                <span style={{ fontWeight: 700, color: '#fff', fontSize: '12px' }}>Interactive Demo</span>
                <span onClick={() => setOpen(false)} style={{ cursor: 'pointer', color: '#94a3b8', fontSize: '14px' }}>&times;</span>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.3rem', marginBottom: '0.8rem' }}>
                {[1, 2, 3, 4].map(n => (
                  <button key={n} onClick={() => runStep(n)} style={{ background: step === n ? '#1e293b' : '#11141c', color: step === n ? '#fff' : '#64748b', border: '1px solid rgba(255,255,255,0.08)', padding: '0.35rem 0', borderRadius: '2px', cursor: 'pointer', fontSize: '10px' }}>
                    S{n}
                  </button>
                ))}
              </div>
              {audit && (
                <div style={{ fontSize: '11px', color: '#cbd5e1', lineHeight: '1.4' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.3rem' }}>
                    <span>Score: <strong style={{ color: '#fff' }}>{audit.score}</strong></span>
                    <span>Consensus: <strong style={{ color: '#fff' }}>{(audit.consensus_ratio * 100).toFixed(0)}%</strong></span>
                  </div>
                  <div style={{ color: '#94a3b8', fontSize: '10px' }}>{audit.lender_verdict}</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [data, setData] = React.useState(null);
      const [oppList, setOppList] = React.useState([]);
      const [selectedOpp, setSelectedOpp] = React.useState('OPP-9001');
      const [units, setUnits] = React.useState(500);

      const runCompute = (oppId, u) => {
        fetch(`${API}/api/simulator`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ opportunity_id: oppId, custom_parameters: { units: Number(u) } })
        }).then(r => r.json()).then(res => {
          if (res.success) setData(res.data);
        });
      };

      React.useEffect(() => {
        fetch(`${API}/api/opportunities`).then(r => r.json()).then(res => setOppList(res.opportunities || []));
        runCompute(selectedOpp, units);
      }, [selectedOpp]);

      if (!data) return <div style={{padding: '2rem'}}>Loading...</div>;

      const res = data.results;

      return (
        <div>
          <div className="top">
            <div>
              <a href="../../index.html">&larr; Root</a> &nbsp;&bull;&nbsp; <strong style={{ color: '#fff' }}>Capital Unlock Simulator</strong>
            </div>
            <div>
              <select value={selectedOpp} onChange={e => { setSelectedOpp(e.target.value); runCompute(e.target.value, units); }}>
                {oppList.map(o => (
                  <option key={o.id} value={o.id}>{o.id} ({o.msme_name})</option>
                ))}
              </select>
            </div>
          </div>

          {/* Minimal Controls */}
          <div className="controls">
            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8' }}>Order Volume</div>
              <input type="range" min="100" max="1500" step="25" value={units} onChange={e => { setUnits(e.target.value); runCompute(selectedOpp, e.target.value); }} />
              <div className="val">{units} Units</div>
            </div>
            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8' }}>Unit Contract Price</div>
              <div className="val" style={{ marginTop: '0.4rem' }}>₹{data.inputs.selling_price} / unit</div>
            </div>
            <div>
              <div style={{ fontSize: '11px', color: '#94a3b8' }}>Raw Material Cost</div>
              <div className="val" style={{ marginTop: '0.4rem' }}>₹{data.inputs.raw_cost} / unit</div>
            </div>
          </div>

          {/* 4 Clean Intervention Modalities */}
          <div className="grid">
            {/* Raw Material Escrow */}
            <div className={`card ${res.raw_material_escrow.is_optimal ? 'optimal' : ''}`}>
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                  <span style={{ fontSize: '11px', color: '#94a3b8' }}>Raw Material Escrow</span>
                  {res.raw_material_escrow.is_optimal && <span style={{ color: '#38bdf8', fontSize: '10px', fontWeight: 700 }}>Optimal</span>}
                </div>
                <div className="row"><span>Capital</span><span className="val">₹{res.raw_material_escrow.capital_required_inr.toLocaleString()}</span></div>
                <div className="row"><span>Revenue</span><span className="val">₹{res.raw_material_escrow.unlocked_revenue_inr.toLocaleString()}</span></div>
                <div className="row"><span>Margin</span><span className="val">₹{res.raw_material_escrow.net_margin_inr.toLocaleString()}</span></div>
              </div>
              <div style={{ marginTop: '1rem', borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: '0.6rem' }}>
                <span style={{ fontSize: '10px', color: '#94a3b8' }}>ROI &nbsp;</span>
                <span style={{ fontSize: '18px', fontWeight: 700, color: '#fff' }}>{res.raw_material_escrow.roi_percentage}%</span>
              </div>
            </div>

            {/* Machinery Leasing */}
            <div className={`card ${res.machinery_leasing.is_optimal ? 'optimal' : ''}`}>
              <div>
                <div style={{ fontSize: '11px', color: '#94a3b8', marginBottom: '0.4rem' }}>Equipment Tooling</div>
                <div className="row"><span>Capital</span><span className="val">₹{res.machinery_leasing.capital_required_inr.toLocaleString()}</span></div>
                <div className="row"><span>Headroom</span><span className="val">{res.machinery_leasing.added_headroom_units} u</span></div>
                <div className="row"><span>Margin</span><span className="val">₹{res.machinery_leasing.net_margin_inr.toLocaleString()}</span></div>
              </div>
              <div style={{ marginTop: '1rem', borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: '0.6rem' }}>
                <span style={{ fontSize: '10px', color: '#94a3b8' }}>ROI &nbsp;</span>
                <span style={{ fontSize: '18px', fontWeight: 700, color: '#fff' }}>{res.machinery_leasing.roi_percentage}%</span>
              </div>
            </div>

            {/* Storage Upgrades */}
            <div className={`card ${res.storage_upgrade.is_optimal ? 'optimal' : ''}`}>
              <div>
                <div style={{ fontSize: '11px', color: '#94a3b8', marginBottom: '0.4rem' }}>Cold Storage</div>
                <div className="row"><span>Capital</span><span className="val">₹{res.storage_upgrade.capital_required_inr.toLocaleString()}</span></div>
                <div className="row"><span>Saved</span><span className="val">{res.storage_upgrade.spoilage_saved_units} u</span></div>
                <div className="row"><span>Margin</span><span className="val">₹{res.storage_upgrade.net_margin_inr.toLocaleString()}</span></div>
              </div>
              <div style={{ marginTop: '1rem', borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: '0.6rem' }}>
                <span style={{ fontSize: '10px', color: '#94a3b8' }}>ROI &nbsp;</span>
                <span style={{ fontSize: '18px', fontWeight: 700, color: '#fff' }}>{res.storage_upgrade.roi_percentage}%</span>
              </div>
            </div>

            {/* Working Capital Line */}
            <div className={`card ${res.working_capital_line.is_optimal ? 'optimal' : ''}`}>
              <div>
                <div style={{ fontSize: '11px', color: '#94a3b8', marginBottom: '0.4rem' }}>Revolving Cash Line</div>
                <div className="row"><span>Capital</span><span className="val">₹{res.working_capital_line.capital_required_inr.toLocaleString()}</span></div>
                <div className="row"><span>Fulfilled</span><span className="val">{res.working_capital_line.fulfilled_units} u</span></div>
                <div className="row"><span>Margin</span><span className="val">₹{res.working_capital_line.net_margin_inr.toLocaleString()}</span></div>
              </div>
              <div style={{ marginTop: '1rem', borderTop: '1px solid rgba(255,255,255,0.06)', paddingTop: '0.6rem' }}>
                <span style={{ fontSize: '10px', color: '#94a3b8' }}>ROI &nbsp;</span>
                <span style={{ fontSize: '18px', fontWeight: 700, color: '#fff' }}>{res.working_capital_line.roi_percentage}%</span>
              </div>
            </div>
          </div>

          <DemoSection onUpdate={() => runCompute(selectedOpp, units)} currentOppId={selectedOpp} />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
